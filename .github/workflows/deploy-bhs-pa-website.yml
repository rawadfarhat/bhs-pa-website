name: Deploy BHS PA Website to GoDaddy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch and GoDaddy destination to deploy
        required: true
        type: choice
        default: staging
        options:
          - staging
          - main
      push_all_files:
        description: Force upload all deployable files (unchecked uploads changed files only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Serialize deployments even when the website folders share a hosting account.
concurrency:
  group: bhs-pa-website-godaddy-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ (inputs.target_branch || github.ref_name) == 'main' && 'production' || 'staging' }}
    env:
      TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}
      PUSH_ALL_FILES: ${{ github.event_name == 'push' || inputs.push_all_files }}
      TERM: dumb
      SSH_HOST: ${{ secrets.CPANEL_HOST }}
      SSH_PORT: ${{ secrets.CPANEL_PORT }}
      SSH_USER: ${{ secrets.CPANEL_USERNAME }}
      SSHPASS: ${{ secrets.CPANEL_PASSWORD }}
      PRODUCTION_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
      STAGING_PATH: ${{ secrets.CPANEL_STAGING_DEPLOY_PATH }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || github.ref_name }}

      - name: Validate credentials and select destination
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Set CPANEL_HOST}"
          : "${SSH_PORT:?Set CPANEL_PORT}"
          : "${SSH_USER:?Set CPANEL_USERNAME}"
          : "${SSHPASS:?Set CPANEL_PASSWORD}"
          : "${PRODUCTION_PATH:?Set CPANEL_DEPLOY_PATH}"
          : "${STAGING_PATH:?Set CPANEL_STAGING_DEPLOY_PATH}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo 'Invalid SSH hostname.' >&2; exit 1; }
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo 'Invalid SSH username.' >&2; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$SSH_PORT > 0 && 10#$SSH_PORT <= 65535 )) || { echo 'Invalid SSH port.' >&2; exit 1; }
          for path in "$PRODUCTION_PATH" "$STAGING_PATH"; do
            [[ "$path" =~ ^/home/[a-zA-Z0-9_-]+/public_html(/[a-zA-Z0-9_-]+)*$ ]] || {
              echo 'Website paths must be absolute /home/USER/public_html paths, optionally with subfolders, without a trailing slash.' >&2
              exit 1
            }
            case "$path/" in
              */portal/*|*/portal_staging/*) echo 'Do not target a portal folder.' >&2; exit 1 ;;
            esac
          done
          [[ "$PRODUCTION_PATH" != "$STAGING_PATH" ]] || { echo 'Production and staging paths must differ.' >&2; exit 1; }
          case "$TARGET_BRANCH" in
            main) deploy_path="$PRODUCTION_PATH" ;;
            staging) deploy_path="$STAGING_PATH" ;;
            *) exit 1 ;;
          esac
          echo "DEPLOY_PATH=$deploy_path" >> "$GITHUB_ENV"

      - name: Install SSH deployment tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Confirm remote website folder and config
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -T -p "$SSH_PORT" -o StrictHostKeyChecking=no -o SendEnv=TERM \
            "$SSH_USER@$SSH_HOST" \
            "export TERM=dumb; \
             test -d '$DEPLOY_PATH' || { echo 'Website destination folder does not exist.' >&2; exit 1; }; \
             test -f '$DEPLOY_PATH/config.php' || { echo 'Website config.php is missing from the destination folder.' >&2; exit 1; }; \
             command -v rsync >/dev/null || { echo 'rsync is unavailable on the hosting account.' >&2; exit 1; }; \
             echo 'Remote website checks passed.'"

      - name: Deploy website files
        shell: bash
        run: |
          set -euo pipefail
          # Export tracked files only; never upload a local config or credentials.
          mkdir -p "$RUNNER_TEMP/website-deploy"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/website-deploy"
          upload_options=(--checksum)
          if [[ "$PUSH_ALL_FILES" == 'true' ]]; then
            upload_options=(--ignore-times)
            echo "Deploying $TARGET_BRANCH: force upload all deployable files."
          else
            echo "Deploying $TARGET_BRANCH: upload files with changed contents only."
          fi
          # No --delete: preserve hosting files, portal folders and runtime data.
          sshpass -e rsync -az --no-perms --no-owner --no-group \
            "${upload_options[@]}" \
            --rsync-path='env TERM=dumb rsync' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.agents/' \
            --exclude='/.codex/' \
            --exclude='/.aws/' \
            --exclude='/config.php' \
            --exclude='/config.php.example' \
            --exclude='/logs/' \
            --exclude='/storage/' \
            --exclude='/portal/' \
            --exclude='/portal_staging/' \
            --exclude='/tests/' \
            --exclude='/docs/' \
            --exclude='/diagnose-event-page.php' \
            --exclude='/AGENTS.md' \
            --exclude='/README.md' \
            --exclude='/.gitignore' \
            --exclude='/.gitattributes' \
            --exclude='/.env*' \
            --exclude='*.code-workspace' \
            --exclude='.DS_Store' \
            -e "ssh -T -p $SSH_PORT -o StrictHostKeyChecking=no -o SendEnv=TERM" \
            "$RUNNER_TEMP/website-deploy/" "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
